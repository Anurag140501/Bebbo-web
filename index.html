<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Bebbo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
    }
    .page {
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      height: 100vh;
      text-align: center;
    }
    .page.active {
      display: flex;
    }
    .teddy {
      width: 200px;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ff69b4;
      color: white;
      margin-top: 20px;
      cursor: pointer;
    }
    #page1 {
      background: linear-gradient(to bottom, #f8f8f8, #e0e0e0);
    }
    #page2 {
      background-color: pink;
      background-image: url('https://www.transparenttextures.com/patterns/hearts.png');
      background-repeat: repeat;
    }
    #page3 {
      background: radial-gradient(circle, #ffe6f0, #ff99cc);
    }
  </style>
</head>
<body>
  <div id="page1" class="page active">
    <img src="https://i.imgur.com/Yv1ylYr.png" alt="Emotional Teddy" class="teddy">
    <p>Heyy my bebbo,<br>I have prepared something for you<br>Click on next to see it</p>
    <button onclick="showPage(2)">Next</button>
  </div>

  <div id="page2" class="page">
    <img src="https://i.imgur.com/dvU8N6P.png" alt="Happy Teddy" class="teddy">
    <p>
      My bebbbo I know our time is going tough but in this time we need to support each other.<br>
      Please don't leave me I really love you so muchhhhhh baccha my bebbo 🥺❤️<br>
      I will wait for you plss stay with me forever 🫂💓
    </p>
    <button onclick="showPage(3)">I love you too Anurag</button>
  </div>

  <div id="page3" class="page">
    <img src="https://i.imgur.com/7K6oA6C.gif" alt="Dancing Teddy" class="teddy">
    <h1>Yayyyyyyy</h1>
  </div>

  <script>
    function showPage(pageNumber) {
      const pages = document.querySelectorAll('.page');
      pages.forEach((page, index) => {
        page.classList.remove('active');
        if (index === pageNumber - 1) {
          page.classList.add('active');
        }
      });
    }
  </script>
</body>
</html>
